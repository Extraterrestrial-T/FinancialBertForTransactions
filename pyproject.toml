[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pragma-lite"
version = "0.1.0"
description = "A compact, reproducible PRAGMA-inspired financial event encoder experiment."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "PRAGMA-lite contributors"}]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "torch>=2.2",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6.29",
    "jupyterlab>=4.1",
    "matplotlib>=3.8",
]
test = ["pytest>=8.0"]
web = [
    "flask>=3.0",
    "gunicorn>=22.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pragma_lite = ["data/vocabulary.json"]

# Vercel resolves this project with uv on Linux. Pin torch to PyTorch's CPU
# wheel index there: the default Linux PyPI distribution pulls CUDA/NVIDIA
# libraries that the inference-only serverless function cannot use.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
